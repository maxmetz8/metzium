<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background glow -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#0B1633" stop-opacity="1"/>
      <stop offset="100%" stop-color="#040816" stop-opacity="1"/>
    </radialGradient>

    <!-- Multi-stop gradient similar to the original logo -->
    <linearGradient id="mGradient" x1="220" y1="512" x2="804" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#8B2CFF"/>
      <stop offset="22%"  stop-color="#00E5FF"/>
      <stop offset="55%"  stop-color="#FFD43B"/>
      <stop offset="78%"  stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#FF2AA6"/>
    </linearGradient>

    <!-- Soft shadow for the M -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Subtle highlight -->
    <linearGradient id="mHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <mask id="highlightMask">
      <rect x="0" y="0" width="1024" height="1024" fill="black"/>
      <!-- highlight band across the top half of the M with rounded curves -->
      <path d="M 280 720 L 280 390 Q 280 340 330 340 L 390 340 Q 420 340 435 370 L 512 520 L 589 370 Q 604 340 634 340 L 694 340 Q 744 340 744 390 L 744 720"
            fill="none" stroke="white" stroke-width="140" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>

  <!-- Rounded square background -->
  <rect x="120" y="160" width="784" height="704" rx="170" fill="url(#bgGlow)"/>

  <!-- The rounded M with smoother curves -->
  <g filter="url(#softShadow)">
    <path d="M 280 720 L 280 390 Q 280 340 330 340 L 390 340 Q 420 340 435 370 L 512 520 L 589 370 Q 604 340 634 340 L 694 340 Q 744 340 744 390 L 744 720"
          fill="none"
          stroke="url(#mGradient)"
          stroke-width="110"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    <!-- Subtle highlight overlay -->
    <rect x="0" y="0" width="1024" height="520" fill="url(#mHighlight)" mask="url(#highlightMask)"/>
  </g>
</svg>
